name: Validate

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  validate-local:
    name: Local Validator & Syntax Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run integration validator
        run: python3 scripts/validate.py

      - name: Check frontend and interactive-builder JavaScript
        run: |
          node --check custom_components/orry/frontend/orry-card.js
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          class ScriptExtractor(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_script = False
                  self.current = []
                  self.scripts = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      self.in_script = True
                      self.current = []

              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.in_script:
                      self.scripts.append("".join(self.current))
                      self.in_script = False

              def handle_data(self, data):
                  if self.in_script:
                      self.current.append(data)

          english_builder = Path("docs/orry-builder.en.html").read_text(encoding="utf-8")
          if re.search(r"[А-Яа-яЁё]", english_builder):
              raise SystemExit("The English builder still contains Cyrillic text.")

          with tempfile.TemporaryDirectory(prefix="orry-builder-js-") as temp_dir:
              for html_path in (Path("docs/orry-builder.html"), Path("docs/orry-builder.en.html")):
                  parser = ScriptExtractor()
                  parser.feed(html_path.read_text(encoding="utf-8"))
                  if not parser.scripts:
                      raise SystemExit(f"No inline JavaScript found in {html_path}.")
                  for index, script in enumerate(parser.scripts):
                      script_path = Path(temp_dir) / f"{html_path.stem}-{index}.js"
                      script_path.write_text(script, encoding="utf-8")
                      subprocess.run(["node", "--check", str(script_path)], check=True)
          print("Frontend and both interactive builders passed JavaScript syntax checks.")
          PY

  hassfest:
    name: Hassfest Validation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run Hassfest
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS Validation
    runs-on: ubuntu-24.04
    steps:
      - name: Run HACS validation
        uses: hacs/action@main
        with:
          category: integration
